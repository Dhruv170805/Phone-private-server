<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans" x-data="app()">
    <!-- Login Page -->
    <div x-show="!isLoggedIn" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
            <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">Assistant Login</h1>
            <form @submit.prevent="login">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Username</label>
                    <input type="text" x-model="loginData.username" class="w-full p-2 border rounded" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 mb-2">Password</label>
                    <input type="password" x-model="loginData.password" class="w-full p-2 border rounded" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 transition" :disabled="loading">
                    <span x-show="!loading">Login</span>
                    <span x-show="loading">Logging in...</span>
                </button>
            </form>
            <p x-show="error" x-text="error" class="text-red-500 mt-4 text-center"></p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div x-show="isLoggedIn" x-cloak class="pb-20">
        <!-- Header -->
        <header class="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md">
            <div class="flex justify-between items-center max-w-4xl mx-auto">
                <h1 class="text-xl font-bold">Personal Assistant</h1>
                <button @click="logout" class="text-sm bg-blue-700 px-3 py-1 rounded">Logout</button>
            </div>
        </header>

        <main class="p-4 max-w-4xl mx-auto space-y-6">
            <!-- Summary Section -->
            <section class="bg-white rounded-lg shadow p-4">
                <h2 class="text-lg font-semibold border-b pb-2 mb-4">Today's Highlights</h2>
                <div class="space-y-4">
                    <!-- Birthdays -->
                    <div>
                        <h3 class="text-sm font-bold text-gray-500 uppercase">🎂 Birthdays</h3>
                        <template x-if="dashboard.birthdays.length === 0">
                            <p class="text-gray-400 text-sm mt-1">No birthdays today.</p>
                        </template>
                        <ul class="mt-2 space-y-2">
                            <template x-for="b in dashboard.birthdays" :key="b.id">
                                <li class="flex items-center justify-between bg-pink-50 p-2 rounded">
                                    <span x-text="b.name" class="font-medium text-pink-800"></span>
                                    <button class="text-xs bg-pink-200 text-pink-800 px-2 py-1 rounded">Msg</button>
                                </li>
                            </template>
                        </ul>
                    </div>

                    <!-- Reminders -->
                    <div>
                        <h3 class="text-sm font-bold text-gray-500 uppercase">⏰ Reminders</h3>
                        <template x-if="dashboard.reminders.length === 0">
                            <p class="text-gray-400 text-sm mt-1">No reminders for today.</p>
                        </template>
                        <ul class="mt-2 space-y-2">
                            <template x-for="r in dashboard.reminders" :key="r.id">
                                <li class="flex items-center justify-between bg-blue-50 p-2 rounded border-l-4" :class="r.priority > 1 ? 'border-red-500' : 'border-blue-400'">
                                    <div class="flex flex-col">
                                        <span x-text="r.task" class="font-medium text-blue-900"></span>
                                        <span x-text="formatDate(r.due_date)" class="text-xs text-blue-600"></span>
                                    </div>
                                    <button @click="completeReminder(r.id)" class="text-gray-400 hover:text-green-600">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                                        </svg>
                                    </button>
                                </li>
                            </template>
                        </ul>
                    </div>
                </div>
            </section>

            <!-- Logs Section -->
            <section class="bg-white rounded-lg shadow p-4 overflow-hidden">
                <h2 class="text-lg font-semibold border-b pb-2 mb-4">System Activity</h2>
                <div class="max-h-60 overflow-y-auto">
                    <ul class="text-sm space-y-2">
                        <template x-for="log in dashboard.logs" :key="log.id">
                            <li class="flex gap-2">
                                <span class="text-gray-400 shrink-0" x-text="formatTime(log.timestamp)"></span>
                                <span class="font-bold shrink-0 uppercase text-[10px] px-1 rounded h-fit mt-0.5" 
                                      :class="log.source === 'email' ? 'bg-purple-100 text-purple-700' : 'bg-gray-100 text-gray-700'"
                                      x-text="log.source"></span>
                                <span class="text-gray-700 break-words" x-text="log.message"></span>
                            </li>
                        </template>
                    </ul>
                </div>
            </section>
        </main>

        <!-- Bottom Navigation -->
        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-2 shadow-lg">
            <button class="flex flex-col items-center p-2 text-blue-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span class="text-[10px]">Today</span>
            </button>
            <button @click="showAddModal = true" class="flex flex-col items-center p-2 text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                <span class="text-[10px]">Add</span>
            </button>
            <button class="flex flex-col items-center p-2 text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
                <span class="text-[10px]">Tasks</span>
            </button>
        </nav>
    </div>

    <script>
        function app() {
            return {
                isLoggedIn: !!localStorage.getItem('token'),
                loading: false,
                error: null,
                loginData: { username: '', password: '' },
                dashboard: { reminders: [], birthdays: [], logs: [] },
                
                async init() {
                    if (this.isLoggedIn) {
                        await this.fetchDashboard();
                    }
                },

                async login() {
                    this.loading = true;
                    this.error = null;
                    try {
                        const res = await fetch('/api/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.loginData)
                        });
                        const data = await res.json();
                        if (res.ok) {
                            localStorage.setItem('token', data.token);
                            this.isLoggedIn = true;
                            await this.fetchDashboard();
                        } else {
                            this.error = data.error || 'Login failed';
                        }
                    } catch (err) {
                        this.error = 'Network error';
                    } finally {
                        this.loading = false;
                    }
                },

                logout() {
                    localStorage.removeItem('token');
                    this.isLoggedIn = false;
                },

                async fetchDashboard() {
                    try {
                        const res = await fetch('/api/dashboard', {
                            headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                        });
                        if (res.status === 401) return this.logout();
                        this.dashboard = await res.json();
                    } catch (err) {
                        console.error('Fetch error:', err);
                    }
                },

                async completeReminder(id) {
                    try {
                        const res = await fetch(`/api/reminders/${id}/complete`, {
                            method: 'PUT',
                            headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                        });
                        if (res.ok) await this.fetchDashboard();
                    } catch (err) {
                        console.error('Complete error:', err);
                    }
                },

                formatDate(iso) {
                    if (!iso) return '';
                    return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                },

                formatTime(iso) {
                    if (!iso) return '';
                    return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
                }
            }
        }
    </script>
</body>
</html>
